services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: edgelog
      POSTGRES_PASSWORD: edgelog
      POSTGRES_DB: edgelog
    ports:
      - "5432:5432"
    volumes:
      - edgelog_postgres_data:/var/lib/postgresql/data

volumes:
  edgelog_postgres_data:
