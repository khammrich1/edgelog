# EdgeLog production Nginx config — canonical, version-controlled source of truth.
# Copy to /etc/nginx/sites-available/edgelog and symlink into sites-enabled.
#
# Frontend and API are served from the SAME origin (this domain). The frontend
# only ever issues relative requests like /api/v1/auth/login, so it inherits
# whatever scheme this file serves the page over — there is no separate
# frontend "API URL" to configure. Do not point /api/ at a different host or
# scheme than the one serving `/`, or a same-origin relative request becomes
# a cross-origin one and the browser enforces CORS on it.

# Redirect all plain HTTP to HTTPS. This must stay enabled — never remove it
# to "fix" an HTTP/HTTPS mismatch; the mismatch is fixed by making sure every
# request (page and API) resolves to this HTTPS server block, not by allowing
# plaintext traffic through.
server {
    listen 80;
    listen [::]:80;
    server_name edgelog.trade;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name edgelog.trade;

    ssl_certificate /etc/letsencrypt/live/edgelog.trade/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edgelog.trade/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Frontend (Vue SPA)
    location / {
        root /var/www/edgelog/frontend;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Backend API — same origin, no CORS needed for the browser's own requests.
    # proxy_pass has no path segment after the port, so the full incoming URI
    # (e.g. /api/v1/auth/register) is forwarded unchanged to FastAPI, which
    # mounts its router at that same /api/v1 prefix.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
